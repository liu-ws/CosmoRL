[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cosmorl"
version = "0.2.0"
description = "Particle-Mesh cosmology and O(3)-equivariant reinforcement learning with PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "classy>=3.3.4,<4",
    # PyTorch initializes its NumPy bridge at import time.
    "numpy>=2,<3",
    # CLASS 3.4 imports SciPy but omits it from its package metadata.
    "scipy>=1.13,<2",
    "torch>=2.11,<3",
]

[project.scripts]
cosmorl = "cosmorl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmorl"]
